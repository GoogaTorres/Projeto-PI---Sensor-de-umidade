<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SafeSoja</title>

    <link rel="stylesheet" href="./styles/logincss.css">
</head>

<body>

    <div class="fundoLoginECadastro"></div>

    <header>

        <div class="header">

            <div class="logo">

                <img onclick="window.location.href='./index.html'"
                    src="./images/Logo_da_Safe_Soja.png">

            </div>

            <div class="dashcal">

                <button class="nav_botao"
                    onclick="window.location.href='./index.html'">
                    Início
                </button>

            </div>

        </div>

    </header>

    <div class="login_box">

        <div class="login_container">

            <h2>Login</h2>

            <input type="text"
                id="input_email"
                placeholder="Digite seu email">

            <input type="password"
                id="input_senha"
                placeholder="Digite sua senha">

            <button class="btn_entrar"
                onclick="Entrar()">
                Entrar
            </button>

            <button class="btn_cadastro"
                onclick="window.location.href='./paginadecadastro.html'">
                Cadastre-se
            </button>

            <div id="div_mensagem"></div>

        </div>

    </div>

</body>

</html>

<script>

    function Entrar() {

        var emailVar = input_email.value;
        var senhaVar = input_senha.value;

        if (emailVar == "" || senhaVar == "") {

            div_mensagem.innerHTML =
                `<b style="color:red;">Preencha todos os campos</b>`;

            return false;
        }

        fetch("/usuarios/autenticar", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                emailServer: emailVar,
                senhaServer: senhaVar

            })

        })

        .then(function (resposta) {

            if (resposta.ok) {

                resposta.json().then(function (json) {

                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.EMAIL_USUARIO = json.email;

                    div_mensagem.innerHTML =
                        `<b style="color:green;">Login realizado ✅</b>`;

                    setTimeout(function () {

                        window.location = "./dash-geral.html";

                    }, 1500);

                });

            } else {

                div_mensagem.innerHTML =
                    `<b style="color:red;">Email ou senha inválidos</b>`;
            }

        })

        .catch(function (erro) {

            console.log(erro);

        });

    }

</script>
