<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SafeSoja</title>

    <link rel="stylesheet" href="./styles/logincss.css">
</head>

<body class="login_body">

    <div class="fundoLoginECadastro"></div>

    <header>

        <div class="header">

            <div class="logo">
                <img onclick="window.location.href='./index.html'"
                    src="./images/Logo_da_Safe_Soja.png">
            </div>

            <div class="dashcal">

                <button class="nav_botao"
                    onclick="window.location.href='./index.html'">
                    Home
                </button>

            </div>

        </div>

    </header>

    <div class="login_box">

        <div class="login_container">

            <h1>Login</h1>

            <h2>Email</h2>
            <input type="text" id="input_email">

            <h2>Senha</h2>
            <input type="password" id="input_senha">

            <h2>Código da Empresa</h2>
            <input type="text" id="input_empresa">

            <button class="btn_entrar" onclick="Entrar()">
                Entrar
            </button>

            <div id="div_mensagem"></div>

            <p class="textoCadastro">
                Não possui conta?
                <a href="./paginadecadastro.html">Cadastre-se</a>
            </p>

        </div>

    </div>

</body>

<script>
    function Entrar() {
        let emailVar = input_email.value;
        let senhaVar = input_senha.value;
        let empresaVar = input_empresa.value;

        if (emailVar == "" || senhaVar == "" || empresaVar == "") {
            div_mensagem.innerHTML = `<b style="color:red;">Preencha todos os campos</b>`;
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({

                emailServer: emailVar,
                senhaServer: senhaVar,
                empresaServer: empresaVar

            }) 
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;
                    sessionStorage.EMPRESA_USUARIO = json.fkEmpresa;
                    sessionStorage.ADMINISTRADOR = json.Administrador;

                    div_mensagem.innerHTML = `<b style="color:green;">Login realizado ✅</b>`;

                    setTimeout(function () {
                        window.location = "./dash-geral.html";
                    }, 1500);
                });
            } else {
                div_mensagem.innerHTML = `<b style="color:red;">Email, senha ou empresa inválidos</b>`;
            }
        })
        .catch(function (erro) {
            console.log(erro);
            div_mensagem.innerHTML = `<b style="color:red;">Erro no servidor</b>`;
        });
    }
</script>

</html>
