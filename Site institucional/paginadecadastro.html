<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SafeSoja</title>

    <link rel="stylesheet" href="./styles/logincss.css">
</head>

<body>

    <div class="fundoLoginECadastro"></div>

    <header>

        <div class="header">

            <div class="logo">

                <img onclick="window.location.href='./index.html'"
                    src="./images/Logo_da_Safe_Soja.png">

            </div>

            <div class="dashcal">

                <button class="nav_botao"
                    onclick="window.location.href='./index.html'">
                    Início
                </button>

            </div>

        </div>

    </header>

    <div class="login_box">

        <div class="login_container">

            <h2>Cadastro</h2>

            <input type="text"
                id="input_nome"
                placeholder="Digite seu nome">

            <input type="text"
                id="input_email"
                placeholder="Digite seu email">

            <input type="text"
                id="input_cpf"
                placeholder="Digite seu CPF">

            <input type="text"
                id="input_celular"
                placeholder="Digite seu celular">

            <input type="password"
                id="input_senha"
                placeholder="Digite sua senha">

            <input type="password"
                id="input_repita"
                placeholder="Repita sua senha">

            <button class="btn_entrar"
                onclick="Cadastrar()">
                Criar conta
            </button>


            <div id="div_mensagem"></div>

        </div>

    </div>

</body>

<script>
    function Cadastrar() {
        let nomeVar = input_nome.value;
        let emailVar = input_email.value;
        let cpfVar = input_cpf.value;
        let celularVar = input_celular.value;
        let senhaVar = input_senha.value;
        let repitaVar = input_repita.value;

        if (
            nomeVar == "" ||
            emailVar == "" ||
            cpfVar == "" ||
            celularVar == "" ||
            senhaVar == "" ||
            repitaVar == ""
        ) {
            div_mensagem.innerHTML = `<b style="color:red;">Preencha todos os campos</b>`;
            return false;
        }

        if (!emailVar.includes("@") || !emailVar.includes(".com")) {
            div_mensagem.innerHTML = `<b style="color:red;">Email inválido</b>`;
            return false;
        }

        if (senhaVar.length < 8) {
            div_mensagem.innerHTML = `<b style="color:red;">Senha deve ter no mínimo 8 caracteres</b>`;
            return false;
        }

        if (senhaVar != repitaVar) {
            div_mensagem.innerHTML = `<b style="color:red;">As senhas não coincidem</b>`;
            return false;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: '{"nomeServer":"' + nomeVar + '","emailServer":"' + emailVar + '","cpfServer":"' + cpfVar + '","celularServer":"' + celularVar + '","senhaServer":"' + senhaVar + '","empresaServer":1}'
        })
        .then(function (resposta) {
            if (resposta.ok) {
                div_mensagem.innerHTML = `<b style="color:lightgreen;">Cadastro realizado ✅</b>`;
                setTimeout(function () {
                    window.location = "./paginaLogin.html";
                }, 2000);
            } else {
                div_mensagem.innerHTML = `<b style="color:red;">Erro ao cadastrar</b>`;
            }
        })
        .catch(function (erro) {
            console.log(erro);
        });
    }
</script>

</html>
