<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="style.css">
</head>

<header>
        <div class="header">

            <div class="logo">
                <img onclick="window.location.href='http:index.html'" src="images/image.png">
            </div>

            <div class="botoes dashcal">
                <button class="nav_botao" onclick="window.location.href='http://localhost:3335/calculadora.html'">Calculadora</button>
                <button class="nav_botao" onclick="window.location.href='http://localhost:3335/dash-geral.html'">Dash geral</button>
                <div class="botao-inicial">
                    <img src="images/home.png" class="homeicon" alt="">
                    <button class="nav_botao inicial" onclick="window.location.href='http://localhost:3335/index.html'">Página
                        inicial</button>
                </div>
            </div>

        </div>

</header>

<body class="fundoBobia">
    <div id="bobia-container">
        <h1>BobIA</h1>
        <div id="bobiaResposta"></div>
        <textarea id="pergunta" type="text" placeholder="Pergunte alguma coisa"></textarea>
        <br><br>
        <button onclick="gerarResposta()">Gerar Resposta</button>
        
    </div>
</body>

<script>
    async function gerarResposta() {
        let textoPergunta = pergunta.value;

        let respostaHttp = await fetch('/perguntar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: '{"pergunta":"' + textoPergunta + '"}'
        });

        let dados = await respostaHttp.json();

        bobiaResposta.style.display = 'block';
        bobiaResposta.innerHTML = dados.resultado;
    }
</script>

</html>
